<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The logo reduced to a favicon: coral tile, ink border, hard offset shadow, outlined star.
       No blur anywhere — the same rule the rest of the design follows. Drawn rather than traced
       from logo.png so the mark stays crisp at 16px, where a downscaled raster turns to mud.
       Geometry matches public/logo.png: square tile, shadow offset down-right, open star. -->
  <rect x="12" y="14" width="46" height="46" rx="12" fill="#1B1B2F"/>
  <rect x="6" y="6" width="46" height="46" rx="12" fill="#FF5E5B" stroke="#1B1B2F" stroke-width="5"/>
  <path d="M29 15.5 L32.7 24.6 L42.6 25.2 L35 31.6 L37.5 41.2 L29 35.9 L20.5 41.2 L23 31.6 L15.4 25.2 L25.3 24.6 Z"
        fill="none" stroke="#FFFFFF" stroke-width="4.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
