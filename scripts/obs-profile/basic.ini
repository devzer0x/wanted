; WANTED — OBS Studio profile for the delivered server:
;   Intel Core i5-12500 (6C/12T), Intel UHD Graphics 770 iGPU, no discrete GPU,
;   Windows Server 2025, no monitor / no HDMI emulator (indirect display driver supplies
;   the only display target).
;
; Install: server-setup.ps1 step 15 copies this file to
;   %APPDATA%\obs-studio\basic\profiles\WASTED\basic.ini
; and run.ps1 then launches OBS with --profile WASTED --collection WASTED. OBS resolves
; --profile against the [General] Name below (NOT the folder name) and silently falls back to
; the last-used profile when it does not match, so do not change Name here alone.
;
; Every section and key below was checked against the OBS Studio 32.2.2 source that writes this
; file (frontend/widgets/OBSBasic.cpp InitBasicConfigDefaults, frontend/widgets/OBSBasic.hpp for
; the SIMPLE_ENCODER_* string values, frontend/widgets/OBSBasic_Profiles.cpp for the file name
; and the [General] Name key). Rationale for each value is in README.md next to this file.
;
; NO SECRETS LIVE HERE. The stream key is entered in the OBS UI and stored by OBS in the
; profile's service.json, which is never committed. The obs-websocket password lives in the
; harness .env.

[General]
Name=WASTED

[Output]
Mode=Simple

[SimpleOutput]
; x264 is the plan of record. Quick Sync needs a healthy Intel graphics driver on a Server SKU,
; which is exactly the thing in doubt on this box, and Intel's encode offload is reported to
; underperform on Server with load falling back to the CPU. Treat QSV as an upside: once the
; iGPU driver is verified, switch StreamEncoder/RecEncoder to qsv and re-measure.
StreamEncoder=x264
RecEncoder=x264
; veryfast at 1280x720p30 costs roughly one to two of the six cores, which leaves the game and
; the harness room. Do not go slower than veryfast while GTA V shares this CPU.
Preset=veryfast
UseAdvanced=false
; 3500 kbps at 720p30 sits inside every platform's 720p envelope and inside the 1 Gbit NIC's.
VBitrate=3500
ABitrate=160
StreamAudioEncoder=aac
RecAudioEncoder=aac
RecQuality=Stream
RecFormat2=mp4
FilePath=C:\wasted\clips
RecTracks=1
; Replay buffer: run.ps1 starts OBS with --startreplaybuffer, the harness triggers saves over
; obs-websocket and reads the resulting path from the ReplayBufferSaved event, so the file name
; is discovered rather than configured. 30 s covers a death plus its run-up; the 1024 MB cap is
; far above the ~13 MB that 30 s at 3500 kbps actually needs, which is the point - OBS refuses
; to keep the buffer if the cap is too small.
RecRB=true
RecRBTime=30
RecRBSize=1024
RecRBPrefix=wasted

[Video]
; The game runs windowed-borderless at 1280x720 (settings.xml ScreenWidth/ScreenHeight/
; Windowed=2), the virtual display driver lists 1280x720 first, and the canvas matches both.
; Equal base and output resolution means no rescale pass at all.
BaseCX=1280
BaseCY=720
OutputCX=1280
OutputCY=720
; FPSType 0 = "Common FPS Values", read from FPSCommon.
FPSType=0
FPSCommon=30
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Audio]
SampleRate=48000
ChannelSetup=Stereo
