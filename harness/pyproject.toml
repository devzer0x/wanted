[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wasted_harness"
version = "0.1.0"
description = "WANTED harness: the agent's brain, perception, behavior, events, overlay and clips service."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.7",
    "anthropic>=1.0",
    "supabase>=2.31",
    "obsws-python>=1.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# dxcam only installs/works on Windows; the capture code is additionally guarded
# by sys.platform == "win32" so a non-Windows dev install stays functional.
windows = ["dxcam>=0.3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["wasted_harness*"]

[tool.setuptools.package-data]
"wasted_harness.brain.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "FURB", "RUF", "TRY", "BLE", "S"]
ignore = [
    # Deliberate design decisions in this package, not oversights:
    "BLE001", # broad `except Exception` guards every I/O boundary on purpose —
              # the Supabase writer, the OBS clip pipeline and the action
              # executor must never take the 24/7 loop down with them.
    "S110",   # try/except/pass appears only in teardown paths where a second
              # failure has nothing useful to report.
    "TRY003", # error messages here are long on purpose: they are what the 3am
              # operator reads instead of a stack trace.
    "TRY300", # `return` inside `try` is clearer than an `else:` block here.
    "TRY400", # log.error (not .exception) is right where the message already
              # carries the formatted cause and a traceback would be noise.
    "E501",   # long lines are limited to prose in docstrings and log strings.
    "S101",   # asserts are used as internal invariants, never for validation.
    "S311",   # `random` drives behavioural variety (which line, which activity,
              # how long to hesitate). Nothing here is a security decision.
    "RUF001", # prose in docstrings uses real typography (em dashes, §).
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001"]
